plugins {
    id 'com.android.application'
}
android {
    namespace 'com.dx11bus.android'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.dx11bus.android'
        minSdk 26
        targetSdk 28
        versionCode 1
        versionName '0.1'

        ndk { abiFilters 'arm64-v8a' }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
                cppFlags '-std=c++11 -Wall -Wextra'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}
